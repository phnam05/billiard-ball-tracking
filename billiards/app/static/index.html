<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Billiard Tracker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%23111'/%3E%3Ccircle cx='32' cy='32' r='12' fill='%23fff'/%3E%3Ctext x='32' y='38' font-size='16' text-anchor='middle' font-family='Arial' font-weight='700'%3E8%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="shell">
  <nav class="sidebar" aria-label="Main">
    <a class="brand" href="#/library">
      <span class="brand-ball" aria-hidden="true">8</span>
      <span class="brand-text">Billiard<br>Tracker</span>
    </a>
    <a class="nav-link" href="#/library" data-nav="library">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4z M4 9h16 M9 5v4 M15 5v4"/></svg>
      <span>Library</span>
    </a>
    <a class="nav-link" href="#/runs" data-nav="runs">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14 M5 12h14 M5 18h9"/></svg>
      <span>Results</span><b class="nav-badge" id="runs-badge" hidden></b>
    </a>
    <a class="nav-link" href="#/live" data-nav="live">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M6.3 6.3a8 8 0 0 0 0 11.4 M17.7 6.3a8 8 0 0 1 0 11.4"/></svg>
      <span>Live</span><b class="nav-dot" id="live-dot" hidden></b>
    </a>
    <a class="nav-link" href="#/help" data-nav="help">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6 M12 17h.01"/></svg>
      <span>Help</span>
    </a>
    <div class="sidebar-foot" id="sidebar-foot"></div>
  </nav>
  <main class="main" id="main" tabindex="-1"></main>
</div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<div class="drop-overlay" id="drop-overlay" hidden><div>Drop videos to add them to the library</div></div>
<script src="/app.js"></script>
</body>
</html>
