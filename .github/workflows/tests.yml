name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # headless OpenCV: the runner has no display, and the pipeline is
          # expected to work without one.
          pip install opencv-python-headless numpy scipy pyyaml
          pip install -r requirements-dev.txt

      - name: Unit tests
        run: pytest -q -m "not slow"

      - name: End-to-end tests (renders a synthetic clip and scores it)
        run: pytest -q -m slow

  accuracy:
    # Publishes the tracking metrics so a regression is visible in the log
    # rather than only as a failed assertion.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install opencv-python-headless numpy scipy pyyaml
      - name: Render a ground-truth clip and score a full run against it
        run: |
          python tools/make_synthetic_clip.py \
            --out out/break.mp4 --ground-truth out/gt.csv --duration 6
          python main.py track out/break.mp4 --csv out/tracks.csv --quiet
          python tools/evaluate.py --gt out/gt.csv --tracks out/tracks.csv \
            --json out/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: accuracy-report
          path: out/report.json
